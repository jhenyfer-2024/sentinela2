<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>MedFlow Kids</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {

  background:
    linear-gradient(
      135deg,
      #dff6ff,
      #f5fffb
    );

  height: 100vh;

  overflow: hidden;

  color: #31566b;
}


/* =====================================
   RELÓGIO
===================================== */

.relogio {

  position: fixed;

  top: 15px;
  right: 20px;

  background: #ffffff;

  color: #168ac4;

  padding: 10px 20px;

  font-size: 1.8vw;

  font-weight: bold;

  letter-spacing: 2px;

  box-shadow:
    0 5px 15px rgba(0,0,0,0.08);

  z-index: 100;
}


/* =====================================
   TELA PRINCIPAL
===================================== */

.tv-container {

  display: flex;

  width: 94vw;

  height: 88vh;

  margin: auto;

  gap: 15px;
}


/* =====================================
   PAINÉIS
===================================== */

.left-panel {

  width: 32%;

  display: flex;

  flex-direction: column;

  gap: 15px;
}


.right-panel {

  width: 68%;

  display: flex;

  flex-direction: column;

  gap: 15px;
}


/* =====================================
   CAIXAS
===================================== */

.box {

  background: #ffffff;

  padding: 25px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;

  box-shadow:
    0 6px 20px rgba(0,0,0,0.08);

  overflow: hidden;

  position: relative;
}


/* =====================================
   DECORAÇÕES
===================================== */

.box::before {

  content: "✦";

  position: absolute;

  top: 15px;

  right: 20px;

  color: #81d4fa;

  font-size: 24px;
}


.box::after {

  content: "♥";

  position: absolute;

  bottom: 12px;

  left: 20px;

  color: #a5d6a7;

  font-size: 22px;
}


/* =====================================
   TÍTULOS
===================================== */

.box-title {

  color: #168ac4;

  font-size: 2vw;

  font-weight: bold;

  margin-bottom: 15px;
}


/* =====================================
   LOCAL
===================================== */

.local-box {

  flex: 1;

  background:
    linear-gradient(
      145deg,
      #e5f8ff,
      #ffffff
    );
}


.local-number {

  color: #4caf50;

  font-size: 8vw;

  font-weight: bold;

  line-height: 1;

  animation:
    flutuar 3s infinite;
}


.local-type {

  color: #6c8795;

  font-size: 1.4vw;

  margin-top: 12px;

  font-weight: bold;
}


/* =====================================
   HISTÓRICO
===================================== */

.history-box {

  flex: 1;

  justify-content: flex-start;

  align-items: stretch;

  background: #ffffff;
}


.history-box .box-title {

  text-align: center;

  color: #43a047;

  font-size: 1.6vw;
}


#history-list {

  list-style: none;

  width: 100%;

  color: #397b4a;

  font-size: 1.3vw;

  font-weight: bold;
}


#history-list li {

  padding: 10px;

  margin-bottom: 6px;

  background: #f2fbf4;

  animation:
    entrar 0.4s ease;
}


/* =====================================
   PACIENTE
===================================== */

.patient-box {

  flex: 3;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #e9f8ff
    );
}


.patient-box .box-title {

  font-size: 2.4vw;

  color: #168ac4;
}


.patient-name {

  color: #087bb5;

  font-size: 6.3vw;

  font-weight: bold;

  line-height: 1.15;

  max-width: 90%;

  word-break: break-word;

  text-shadow:
    2px 3px 5px rgba(0,0,0,0.08);
}


/* =====================================
   RODAPÉ
===================================== */

.rodape {

  flex: 1;

  background: #ffffff;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 20px 30px;

  box-shadow:
    0 6px 20px rgba(0,0,0,0.08);
}


.logo-text {

  color: #168ac4;

  font-size: 2.5vw;

  font-weight: bold;
}


.subtitulo {

  color: #54a85d;

  font-size: 1.2vw;

  margin-top: 5px;

  font-weight: bold;
}


.mensagem {

  text-align: right;

  color: #78909c;

  font-size: 1.1vw;
}


.mensagem strong {

  display: block;

  color: #168ac4;

  font-size: 1.3vw;

  margin-top: 5px;
}


/* =====================================
   ANIMAÇÃO DA CHAMADA
===================================== */

@keyframes chamada {

  0% {
    transform: scale(1);
    background: #ffffff;
  }

  30% {
    transform: scale(1.025);
    background: #dff6ff;
  }

  60% {
    transform: scale(1);
    background: #e8f8ea;
  }

  100% {
    transform: scale(1);
    background: #ffffff;
  }
}


.flash {

  animation:
    chamada 0.7s ease 3;
}


/* =====================================
   ENTRADA DO NOME
===================================== */

@keyframes nomeEntrada {

  from {

    opacity: 0;

    transform:
      scale(0.75)
      translateY(25px);
  }

  to {

    opacity: 1;

    transform:
      scale(1)
      translateY(0);
  }
}


.nome-novo {

  animation:
    nomeEntrada 0.6s ease;
}


/* =====================================
   MOVIMENTO DO NÚMERO
===================================== */

@keyframes flutuar {

  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-7px);
  }
}


/* =====================================
   HISTÓRICO
===================================== */

@keyframes entrar {

  from {

    opacity: 0;

    transform:
      translateX(-15px);
  }

  to {

    opacity: 1;

    transform:
      translateX(0);
  }
}


/* =====================================
   RESPONSIVO
===================================== */

@media (max-width: 800px) {

  .tv-container {

    width: 97vw;

    height: 90vh;

    gap: 8px;
  }

  .box {

    padding: 12px;
  }

  .relogio {

    font-size: 16px;

    top: 8px;

    right: 8px;
  }

}

</style>

</head>


<body>


<!-- =====================================
     RELÓGIO
===================================== -->

<div
  class="relogio"
  id="relogio"
>
  00:00:00
</div>


<!-- =====================================
     PAINEL
===================================== -->

<div class="tv-container">


  <!-- LADO ESQUERDO -->

  <div class="left-panel">


    <!-- LOCAL -->

    <div class="box local-box">

      <div
        class="box-title"
        id="local-tipo"
      >
        GUICHÊ
      </div>

      <div
        class="local-number"
        id="local-numero"
      >
        --
      </div>

      <div class="local-type">

        📍 Local de atendimento

      </div>

    </div>


    <!-- HISTÓRICO -->

    <div class="box history-box">

      <div class="box-title">

        🧸 ÚLTIMAS CHAMADAS

      </div>

      <ul id="history-list"></ul>

    </div>

  </div>


  <!-- LADO DIREITO -->

  <div class="right-panel">


    <!-- PACIENTE -->

    <div
      class="box patient-box"
    >

      <div class="box-title">

        🔔 É A SUA VEZ!

      </div>

      <div
        class="patient-name"
        id="patient-name"
      >
        AGUARDANDO...
      </div>

    </div>


    <!-- RODAPÉ -->

    <div class="rodape">

      <div>

        <div class="logo-text">

          🧸 MedFlow Kids

        </div>

        <div class="subtitulo">

          🩺 Atendimento Infantil

        </div>

      </div>


      <div class="mensagem">

        💙 Obrigado por aguardar

        <strong>

          Cuidando dos pequenos com carinho

        </strong>

      </div>

    </div>

  </div>

</div>


<script>


/* =====================================
   RELÓGIO
===================================== */

function atualizarRelogio() {

  const agora = new Date();

  const horas =
    String(
      agora.getHours()
    ).padStart(2, "0");

  const minutos =
    String(
      agora.getMinutes()
    ).padStart(2, "0");

  const segundos =
    String(
      agora.getSeconds()
    ).padStart(2, "0");

  document.getElementById(
    "relogio"
  ).innerText =

    horas +
    ":" +
    minutos +
    ":" +
    segundos;
}


atualizarRelogio();


setInterval(
  atualizarRelogio,
  1000
);


/* =====================================
   CHAMADAS
===================================== */

let ultimoId = null;


function atualizar() {

  fetch("/tv/chamada")

    .then(r => r.json())

    .then(data => {

      const chamada =
        data.chamada;

      const historico =
        data.historico || [];


      if (chamada) {

        document.getElementById(
          "local-tipo"
        ).innerText =

          chamada.localTipo ||
          "GUICHÊ";


        document.getElementById(
          "local-numero"
        ).innerText =

          chamada.localNumero ||
          "--";


        const nome =
          document.getElementById(
            "patient-name"
          );


        nome.innerText =

          chamada.paciente ||
          "AGUARDANDO...";


        /* NOVA CHAMADA */

        if (
          chamada.id !==
          ultimoId
        ) {

          ultimoId =
            chamada.id;


          const patientBox =
            document.querySelector(
              ".patient-box"
            );


          patientBox.classList.remove(
            "flash"
          );


          nome.classList.remove(
            "nome-novo"
          );


          void patientBox.offsetWidth;


          patientBox.classList.add(
            "flash"
          );


          nome.classList.add(
            "nome-novo"
          );

        }

      }


      /* =================================
         HISTÓRICO
      ================================= */

      const list =
        document.getElementById(
          "history-list"
        );


      list.innerHTML = "";


      historico
        .slice(0, 4)
        .forEach(h => {

          const li =
            document.createElement(
              "li"
            );


          const tipo =
            h.localTipo

              ? h.localTipo.substring(
                  0,
                  4
                )

              : "GUIC";


          li.innerText =

            `${tipo}. ${h.localNumero} - ${h.paciente}`;


          list.appendChild(li);

        });

    })

    .catch(err => {

      console.log(
        "Erro ao buscar chamada:",
        err
      );

    });

}


/* Atualiza a cada 2 segundos */

atualizar();

setInterval(
  atualizar,
  2000
);

</script>


</body>

</html>
